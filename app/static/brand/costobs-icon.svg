  <rect x="11" y="11" width="26" height="26" rx="7" fill="#FF3621"/>
  <polyline points="15,19 20.5,25 24.5,21.5 31,28.5" stroke="#FFFFFF" stroke-width="2.6" stroke-linecap="round" stroke-linejoin="round" fill="none"/>
  <circle cx="31" cy="28.5" r="2.4" fill="#FFFFFF"/>
