targets:
  fevm-smathews:
    mode: development
    workspace:
      host: https://fevm-serverless-stable-smathews.cloud.databricks.com
      profile: fevm-smathews
    variables:
      app_name: cost-observability-dev
      catalog: serverless_stable_smathews_catalog
      schema: cost_obs_dev
      warehouse_id: 6f225d8cc2b83dbc
      lakebase_project_name: cost-obs-db-dev
      lakebase_endpoint_name: projects/cost-obs-db-dev/branches/production/endpoints/primary
    resources:
      postgres_projects:
        cost_obs_db:
          project_id: ${var.lakebase_project_name}
          pg_version: 16
      postgres_branches:
        cost_obs_main:
          branch_id: production
          parent: projects/${var.lakebase_project_name}
      postgres_endpoints:
        cost_obs_endpoint:
          endpoint_id: primary
          endpoint_type: ENDPOINT_TYPE_READ_WRITE
          parent: projects/${var.lakebase_project_name}/branches/production
