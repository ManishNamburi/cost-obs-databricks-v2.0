targets:
  cmegdemos:
    mode: development
    workspace:
      host: https://fevm-cmegdemos.cloud.databricks.com
      profile: "cmeg demo"
      root_path: /Workspace/Users/sam.mathews@databricks.com/.bundle/${bundle.name}/${bundle.target}
    variables:
      # Distinct from the existing cost-obs-demo2 app + its cmegdemos_catalog.cost_obs
      # schema so this 2.1 test deploy does not collide with the default app.
      app_name: cost-obs-2-1
      catalog: cmegdemos_catalog
      schema: cost_obs_2_1
      warehouse_id: 9cd919d96b11bf1c
      lakebase_project_name: cost-obs-db-v21
      lakebase_endpoint_name: projects/cost-obs-db-v21/branches/production/endpoints/primary
      lakebase_read_mode: on
      genie_space_id: "01f1c74dbd881472b50b041c6519fb01"
    resources:
      apps:
        cost_obs_app:
          config:
            env:
              - name: COST_OBS_CATALOG
                value: ${var.catalog}
              - name: COST_OBS_SCHEMA
                value: ${var.schema}
              - name: ENDPOINT_NAME
                value: ${var.lakebase_endpoint_name}
              - name: DATABRICKS_WAREHOUSE_ID
                value_from: sql-warehouse
              - name: COST_OBS_LAKEBASE_READ
                value: ${var.lakebase_read_mode}
              - name: COST_OBS_SETUP_JOB_ID
                value: ${resources.jobs.cost_obs_setup.id}
              - name: GENIE_SPACE_ID
                value: ${var.genie_space_id}
      postgres_projects:
        cost_obs_db:
          project_id: ${var.lakebase_project_name}
          pg_version: 16
          # Production branches stay awake unless this is set. 0.5–4 CU, sleep
          # after 5 minutes idle (wakes on the next connection).
          default_endpoint_settings:
            autoscaling_limit_min_cu: 0.5
            autoscaling_limit_max_cu: 4
            suspend_timeout_duration: 300s
      # NOTE: managed postgres_synced_tables were evaluated here but require a UC
      # catalog registered over the Lakebase DB (CREATE CATALOG on the metastore
      # = metastore admin), which neither this workspace's deployer nor a typical
      # customer app SP has. Phase B therefore uses an APP-MANAGED direct load
      # (warehouse computes aggregates -> app writes to Lakebase via psycopg,
      # using the Phase A primitives) instead of managed synced tables.
