targets:
  e2-dogfood:
    mode: development
    workspace:
      host: https://e2-dogfood.staging.cloud.databricks.com
      profile: e2-dogfood
      root_path: /Workspace/Users/sam.mathews@databricks.com/.bundle/${bundle.name}/${bundle.target}
    variables:
      app_name: cost-observability-dogfood
      catalog: sam_mathews
      schema: cost_obs
      warehouse_id: dd43ee29fedd958d
      lakebase_project_name: cost-obs-dogfood
      lakebase_endpoint_name: projects/cost-obs-dogfood/branches/production/endpoints/primary
    resources:
      postgres_projects:
        cost_obs_db:
          project_id: ${var.lakebase_project_name}
          pg_version: 16
      postgres_branches:
        cost_obs_main:
          branch_id: production
          parent: projects/${var.lakebase_project_name}
      postgres_endpoints:
        cost_obs_endpoint:
          endpoint_id: primary
          endpoint_type: ENDPOINT_TYPE_READ_WRITE
          parent: projects/${var.lakebase_project_name}/branches/production
