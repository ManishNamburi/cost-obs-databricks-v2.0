targets:
  e2-dogfood:
    mode: development
    workspace:
      host: https://e2-dogfood.staging.cloud.databricks.com
      profile: e2-dogfood
      root_path: /Workspace/Users/sam.mathews@databricks.com/.bundle/${bundle.name}/${bundle.target}
    variables:
      app_name: cost-observability-dogfood
      catalog: sam_mathews
      schema: cost_obs
      warehouse_id: dd43ee29fedd958d
      lakebase_project_name: cost-obs-dogfood
      lakebase_endpoint_name: projects/cost-obs-dogfood/branches/production/endpoints/primary
    resources:
      postgres_projects:
        cost_obs_db:
          project_id: ${var.lakebase_project_name}
          pg_version: 16
          default_endpoint_settings:
            autoscaling_limit_min_cu: 0.5
            autoscaling_limit_max_cu: 4
            suspend_timeout_duration: 300s
