# v1 → v2 upgrade. Reuse the customer's v1 catalog, schema, and warehouse.
# Lakebase and the v2 app are new — v1 keeps running until cutover.
# Workspace host comes from the CLI profile (`--profile` or DATABRICKS_HOST).
#
#   cd bundle
#   databricks bundle deploy -t upgrade \
#     --var="catalog=<v1_catalog>" \
#     --var="schema=<v1_schema>" \
#     --var="warehouse_id=<v1_warehouse_id>"
#   databricks bundle run cost_obs_setup -t upgrade

targets:
  upgrade:
    mode: production
    workspace:
      root_path: /Workspace/Users/${workspace.current_user.userName}/.bundle/${bundle.name}/${bundle.target}
    variables:
      deployment_mode: migrate
      app_name: cost-observability-v2
      catalog: ""
      schema: ""
      warehouse_id: ""
      lakebase_project_name: cost-obs-db-v2
      lakebase_endpoint_name: projects/cost-obs-db-v2/branches/production/endpoints/primary
      lakebase_read_mode: on
      genie_space_id: ""
    resources:
      postgres_projects:
        cost_obs_db:
          project_id: ${var.lakebase_project_name}
          pg_version: 16
          default_endpoint_settings:
            autoscaling_limit_min_cu: 0.5
            autoscaling_limit_max_cu: 4
            suspend_timeout_duration: 300s
