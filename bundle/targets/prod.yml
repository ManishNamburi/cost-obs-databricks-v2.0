targets:
  prod:
    mode: production
    workspace:
      host: ${var.workspace_host}
    variables:
      app_name: cost-observability
      catalog: main
      schema: cost_obs
      lakebase_project_name: cost-obs-db
      lakebase_endpoint_name: projects/cost-obs-db/branches/production/endpoints/primary
    permissions:
      - level: CAN_VIEW
        group_name: cost_obs_viewers
      - level: CAN_MANAGE
        group_name: cost_obs_admins
    resources:
      postgres_projects:
        cost_obs_db:
          project_id: ${var.lakebase_project_name}
          pg_version: 16
      postgres_branches:
        cost_obs_main:
          branch_id: production
          parent: projects/${var.lakebase_project_name}
      postgres_endpoints:
        cost_obs_endpoint:
          endpoint_id: primary
          endpoint_type: ENDPOINT_TYPE_READ_WRITE
          parent: projects/${var.lakebase_project_name}/branches/production
