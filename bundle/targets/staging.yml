targets:
  staging:
    mode: development
    workspace:
      host: ${var.workspace_host}
    variables:
      app_name: cost-observability-staging
      catalog: main
      schema: cost_obs_staging
      lakebase_project_name: cost-obs-db-staging
      lakebase_endpoint_name: projects/cost-obs-db-staging/branches/production/endpoints/primary
    resources:
      postgres_projects:
        cost_obs_db:
          project_id: ${var.lakebase_project_name}
          pg_version: 16
      postgres_branches:
        cost_obs_main:
          branch_id: production
          parent: projects/${var.lakebase_project_name}
      postgres_endpoints:
        cost_obs_endpoint:
          endpoint_id: primary
          endpoint_type: ENDPOINT_TYPE_READ_WRITE
          parent: projects/${var.lakebase_project_name}/branches/production
