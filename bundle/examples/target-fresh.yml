# Fresh install — copy to bundle/targets/<your-target>.yml and fill every
# REPLACE_ME value. Do not leave this file under bundle/targets/ (it would
# become a live DAB target).
#
# Motion: create catalog/schema gold, Lakebase, Genie, and the v2 app.
# Bind an existing Serverless or Pro warehouse; this bundle does not create
# warehouses.
#
#   cd bundle
#   databricks bundle deploy -t <your-target>
#   databricks bundle run cost_obs_setup -t <your-target>

targets:
  REPLACE_ME_TARGET_NAME:
    mode: production
    workspace:
      host: https://REPLACE_ME.cloud.databricks.com
      # profile: REPLACE_ME_CLI_PROFILE
    variables:
      deployment_mode: fresh
      app_name: cost-observability
      # Dedicated UC names — do not use main.cost_obs
      catalog: REPLACE_ME_CATALOG
      schema: cost_obs
      warehouse_id: REPLACE_ME_WAREHOUSE_ID
      workspace_scope: ""
      lakebase_project_name: cost-obs-db
      lakebase_endpoint_name: projects/cost-obs-db/branches/production/endpoints/primary
      lakebase_read_mode: on
      # Leave empty — setup creates the cost-obs Genie space
      genie_space_id: ""
      ai_gateway_usage_table: ""
      databricks_account_id: ""
    resources:
      postgres_projects:
        cost_obs_db:
          project_id: ${var.lakebase_project_name}
          pg_version: 16
          default_endpoint_settings:
            autoscaling_limit_min_cu: 0.5
            autoscaling_limit_max_cu: 4
            suspend_timeout_duration: 300s
