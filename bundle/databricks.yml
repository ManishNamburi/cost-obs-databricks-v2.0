bundle:
  name: cost-obs

include:
  - resources/*.yml
  - targets/*.yml

variables:
  workspace_host:
    description: Databricks workspace URL (e.g. https://my-workspace.azuredatabricks.net)
    default: ""
  app_name:
    description: Databricks App name
    default: cost-observability
  catalog:
    description: Unity Catalog catalog for materialized views
    default: main
  schema:
    description: Unity Catalog schema for materialized views
    default: cost_obs
  warehouse_id:
    description: Serverless or Pro SQL warehouse ID
    default: ""
  workspace_scope:
    description: Comma-separated workspace IDs to scope the dashboard (empty = all)
    default: ""
  lakebase_project_name:
    description: Lakebase Autoscaling project name
    default: cost-obs-db
  lakebase_endpoint_name:
    description: Lakebase endpoint name
    default: cost-obs-endpoint
  genie_space_id:
    description: Genie space ID (optional — leave empty to skip Genie seeding)
    default: ""
  ai_gateway_usage_table:
    description: >
      Admin-managed derived table for AI Gateway usage data.
      Must be created by an account admin from system.ai_gateway.usage and refreshed
      by a scheduled job.  Format: catalog.schema.table_name
      Example: main.cost_obs.ai_gateway_usage_shared
    default: ""
  databricks_account_id:
    description: >
      Databricks account UUID. Required for account-level APIs (budgets, usage policies).
      Not injected automatically by the Apps runtime — set this explicitly.
      Find it in the Databricks account console under your user menu.
    default: ""
  deployment_mode:
    description: >
      Setup-job behaviour when the target workspace may already have a cost-obs
      deployment. "auto" (default) probes for existing MVs and setup_state rows
      to decide between fresh install and 1.1 -> 2.1 migration.  Override to
      "fresh" (skip migration; treat catalog as empty) or "migrate" (force
      migration; fail if prior state is absent) for explicit control.
    default: auto

sync:
  paths:
    - .
    - ../setup

