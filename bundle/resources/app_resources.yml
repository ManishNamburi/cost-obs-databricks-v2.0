# App resource bindings — Databricks injects env vars for each resource automatically.
# After bundle deploy, confirm each resource is visible in the App UI before running setup job.
#
# sql-warehouse  → DATABRICKS_WAREHOUSE_ID
# lakebase       → PGHOST, PGPORT, PGDATABASE, PGUSER, PGSSLMODE (via postgres resource binding)
# ENDPOINT_NAME  → set explicitly in app.yml (not auto-injected by postgres binding)
#
# Custom env vars injected via the app config below:
# AI_GATEWAY_USAGE_TABLE → admin-managed derived table path (optional)

resources:
  apps:
    cost_obs_app:
      config:
        command: ["uvicorn", "backend.app:app", "--host", "0.0.0.0", "--port", "8000"]
        env:
          - name: COST_OBS_CATALOG
            value: ${var.catalog}
          - name: COST_OBS_SCHEMA
            value: ${var.schema}
          - name: AI_GATEWAY_USAGE_TABLE
            value: ${var.ai_gateway_usage_table}
      resources:
        - name: sql-warehouse
          description: Serverless or Pro SQL warehouse for system table queries
          sql_warehouse:
            id: ${var.warehouse_id}
            permission: CAN_USE

        - name: lakebase
          description: Lakebase Autoscaling project — injects PGHOST/PGUSER/PGDATABASE/PGPORT/PGSSLMODE
          postgres:
            branch: projects/${var.lakebase_project_name}/branches/main
            database: projects/${var.lakebase_project_name}/branches/main/databases/databricks-postgres
            permission: CAN_CONNECT_AND_CREATE
