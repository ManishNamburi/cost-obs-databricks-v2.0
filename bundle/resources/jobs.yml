resources:
  jobs:
    cost_obs_setup:
      name: cost-obs-setup
      description: >
        One-time onboarding job. Run once after first bundle deploy, or to repair a workspace.
        Each task is idempotent — safe to re-run. Writes completion markers to Lakebase.
      tasks:
        - task_key: validate
          description: Check environment variables, UC permissions, and warehouse connectivity
          notebook_task:
            notebook_path: ${workspace.root_path}/files/setup/notebooks/01_validate_prereqs
            source: WORKSPACE
            base_parameters:
              ENDPOINT_NAME: ${var.lakebase_endpoint_name}
              DATABRICKS_WAREHOUSE_ID: ${var.warehouse_id}
              COST_OBS_CATALOG: ${var.catalog}
              COST_OBS_SCHEMA: ${var.schema}
              DEPLOYMENT_MODE: ${var.deployment_mode}
          environment_key: default

        - task_key: bootstrap_lakebase
          description: Create schema, OAuth role, grants, ALTER DEFAULT PRIVILEGES, setup_state table
          depends_on:
            - task_key: validate
          notebook_task:
            notebook_path: ${workspace.root_path}/files/setup/notebooks/02_lakebase_bootstrap
            source: WORKSPACE
            base_parameters:
              ENDPOINT_NAME: ${var.lakebase_endpoint_name}
              DATABRICKS_WAREHOUSE_ID: ${var.warehouse_id}
              COST_OBS_CATALOG: ${var.catalog}
              COST_OBS_SCHEMA: ${var.schema}
              APP_NAME: ${var.app_name}
          environment_key: default

        - task_key: migrate_delta
          description: Migrate historical data from Delta tables into Lakebase (idempotent)
          depends_on:
            - task_key: bootstrap_lakebase
          notebook_task:
            notebook_path: ${workspace.root_path}/files/setup/notebooks/02b_migrate_delta
            source: WORKSPACE
            base_parameters:
              ENDPOINT_NAME: ${var.lakebase_endpoint_name}
              DATABRICKS_WAREHOUSE_ID: ${var.warehouse_id}
              COST_OBS_CATALOG: ${var.catalog}
              COST_OBS_SCHEMA: ${var.schema}
              DEPLOYMENT_MODE: ${var.deployment_mode}
          environment_key: default

        - task_key: build_gold
          description: >
            Build warehouse gold (full on fresh, incremental on v1 upgrade) and
            copy dashboard aggregates into Lakebase so the app does not wait on
            a Settings rebuild.
          timeout_seconds: 14400
          depends_on:
            - task_key: bootstrap_lakebase
          notebook_task:
            notebook_path: ${workspace.root_path}/files/setup/notebooks/02c_build_gold
            source: WORKSPACE
            base_parameters:
              ENDPOINT_NAME: ${var.lakebase_endpoint_name}
              DATABRICKS_WAREHOUSE_ID: ${var.warehouse_id}
              COST_OBS_CATALOG: ${var.catalog}
              COST_OBS_SCHEMA: ${var.schema}
              DEPLOYMENT_MODE: ${var.deployment_mode}
              LOOKBACK_DAYS: "180"
          environment_key: default

        - task_key: seed_genie
          description: Create and configure the customer Genie space (creates one if GENIE_SPACE_ID is empty)
          depends_on:
            - task_key: build_gold
          notebook_task:
            notebook_path: ${workspace.root_path}/files/setup/notebooks/03_seed_genie
            source: WORKSPACE
            base_parameters:
              ENDPOINT_NAME: ${var.lakebase_endpoint_name}
              DATABRICKS_WAREHOUSE_ID: ${var.warehouse_id}
              COST_OBS_CATALOG: ${var.catalog}
              COST_OBS_SCHEMA: ${var.schema}
              DEPLOYMENT_MODE: ${var.deployment_mode}
              # Empty GENIE_SPACE_ID: seed_genie creates (or reuses) the cost-obs space.
              GENIE_SPACE_ID: ${var.genie_space_id}
              # APP_NAME lets seed_genie resolve the app SP's client_id to grant
              # it CAN_RUN on the Genie space at runtime (binding is not in the DAB).
              APP_NAME: ${var.app_name}
          environment_key: default

        - task_key: setup_usage_policy
          description: Create or validate serverless usage policy for cost attribution
          depends_on:
            - task_key: bootstrap_lakebase
          notebook_task:
            notebook_path: ${workspace.root_path}/files/setup/notebooks/04_usage_policy_setup
            source: WORKSPACE
            base_parameters:
              ENDPOINT_NAME: ${var.lakebase_endpoint_name}
              DATABRICKS_WAREHOUSE_ID: ${var.warehouse_id}
              COST_OBS_CATALOG: ${var.catalog}
              COST_OBS_SCHEMA: ${var.schema}
              DEPLOYMENT_MODE: ${var.deployment_mode}
          environment_key: default

        - task_key: verify
          description: Run smoke checks and write final setup_state marker
          depends_on:
            - task_key: seed_genie
            - task_key: setup_usage_policy
            - task_key: migrate_delta
          notebook_task:
            notebook_path: ${workspace.root_path}/files/setup/notebooks/05_post_setup_verify
            source: WORKSPACE
            base_parameters:
              ENDPOINT_NAME: ${var.lakebase_endpoint_name}
              DATABRICKS_WAREHOUSE_ID: ${var.warehouse_id}
              COST_OBS_CATALOG: ${var.catalog}
              COST_OBS_SCHEMA: ${var.schema}
              DEPLOYMENT_MODE: ${var.deployment_mode}
              APP_NAME: ${var.app_name}
          environment_key: default

      environments:
        - environment_key: default
          spec:
            client: "1"
            dependencies:
              - psycopg[binary]
              - psycopg_pool
              - databricks-sql-connector==3.7.4
              - cachetools==7.0.0
              - databricks-sdk==0.81.0
