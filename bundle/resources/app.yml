resources:
  apps:
    cost_obs_app:
      name: ${var.app_name}
      description: Cost Observability App — V2
      source_code_path: ../../app
      config:
        command:
          - uvicorn
          - backend.app:app
          - --host
          - "0.0.0.0"
          - --port
          - "8000"
        env:
          - name: COST_OBS_CATALOG
            value: ${var.catalog}
          - name: COST_OBS_SCHEMA
            value: ${var.schema}
          - name: COST_OBS_WORKSPACES
            value: ${var.workspace_scope}
          - name: GENIE_SPACE_ID
            value: ${var.genie_space_id}
          - name: AI_GATEWAY_USAGE_TABLE
            value: ${var.ai_gateway_usage_table}
          - name: DATABRICKS_ACCOUNT_ID
            value: ${var.databricks_account_id}
          - name: ENDPOINT_NAME
            value: ${var.lakebase_endpoint_name}
      # Resource bindings — Databricks injects env vars automatically:
      # sql-warehouse → DATABRICKS_WAREHOUSE_ID
      # lakebase      → PGHOST, PGPORT, PGDATABASE, PGUSER, PGSSLMODE
      # ENDPOINT_NAME is set explicitly above (not auto-injected by postgres binding)
      resources:
        - name: sql-warehouse
          description: Serverless or Pro SQL warehouse for system table queries
          sql_warehouse:
            id: ${var.warehouse_id}
            permission: CAN_USE

        - name: lakebase
          description: Lakebase Autoscaling project — injects PGHOST/PGUSER/PGDATABASE/PGPORT/PGSSLMODE
          postgres:
            branch: projects/${var.lakebase_project_name}/branches/production
            database: projects/${var.lakebase_project_name}/branches/production/databases/databricks-postgres
            permission: CAN_CONNECT_AND_CREATE

        # Genie space binding — the app SP gets CAN_RUN on the space so
        # genie_service can start conversations on behalf of the app. The
        # space itself is provisioned separately (bundle deploy sets the
        # ID via ${var.genie_space_id}; the space is created either by the
        # customer via UI, or in future by a first-class DAB resource once
        # Databricks exposes one). If genie_space_id is empty, the app runs
        # fine — the Genie tab and conversational surface both gate on the
        # ID being present.
        - name: genie-space
          description: Genie space for cross-app cost Q&A — seeded by setup job
          genie_space:
            id: ${var.genie_space_id}
            permission: CAN_RUN
