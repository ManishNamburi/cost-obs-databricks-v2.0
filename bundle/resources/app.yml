resources:
  apps:
    cost_obs_app:
      name: ${var.app_name}
      description: Cost Observability App — V2
      source_code_path: ../../app
      config:
        command:
          - uvicorn
          - backend.app:app
          - --host
          - "0.0.0.0"
          - --port
          - "8000"
        env:
          - name: COST_OBS_CATALOG
            value: ${var.catalog}
          - name: COST_OBS_SCHEMA
            value: ${var.schema}
          - name: ENDPOINT_NAME
            value: ${var.lakebase_endpoint_name}
          # DATABRICKS_WAREHOUSE_ID is NOT auto-injected by the sql-warehouse
          # binding — it must be sourced explicitly. The bundle's config.env
          # overrides app/app.yaml, so app/app.yaml's valueFrom is ignored and
          # this entry is required or the app reports "No warehouse configured"
          # (breaks the setup wizard + all warehouse-based GRANT/CREATE ops).
          - name: DATABRICKS_WAREHOUSE_ID
            value_from: sql-warehouse
          - name: COST_OBS_LAKEBASE_READ
            value: ${var.lakebase_read_mode}
          - name: COST_OBS_SETUP_JOB_ID
            value: ${resources.jobs.cost_obs_setup.id}
          # Optional env vars — GENIE_SPACE_ID, AI_GATEWAY_USAGE_TABLE,
          # DATABRICKS_ACCOUNT_ID, COST_OBS_WORKSPACES — are intentionally NOT
          # declared here. When their bundle variable is empty (the default),
          # DAB emits an env entry with no `value`, which the Apps API rejects:
          # "Must specify environment variable source using either value or valueFrom".
          # The app treats all four as optional (absent = disabled / auto-detect /
          # all workspaces). To set one, add it to that specific target's app
          # config.env, or set it in the Apps UI after deploy.
      # Resource bindings — Databricks injects env vars automatically:
      # sql-warehouse → DATABRICKS_WAREHOUSE_ID
      # lakebase      → PGHOST, PGPORT, PGDATABASE, PGUSER, PGSSLMODE
      # ENDPOINT_NAME is set explicitly above (not auto-injected by postgres binding)
      resources:
        - name: sql-warehouse
          description: Serverless or Pro SQL warehouse for system table queries
          sql_warehouse:
            id: ${var.warehouse_id}
            permission: CAN_USE

        - name: lakebase
          description: Lakebase Autoscaling project — injects PGHOST/PGUSER/PGDATABASE/PGPORT/PGSSLMODE
          # Creating a Lakebase project auto-provisions a default "production"
          # branch + "primary" endpoint, so the DAB manages only the project
          # (bundle/targets/*.yml). Reference the project's .id here so Terraform
          # orders the app AFTER the project (and thus its default branch) exists
          # — otherwise the app create 404s ("Postgres branch … does not exist").
          # .id resolves to the full name "projects/<slug>", so no extra prefix.
          postgres:
            branch: ${resources.postgres_projects.cost_obs_db.id}/branches/production
            database: ${resources.postgres_projects.cost_obs_db.id}/branches/production/databases/databricks-postgres
            permission: CAN_CONNECT_AND_CREATE

        # NOTE: the Genie space is intentionally NOT declared as an app resource
        # binding here. An empty space_id binding is rejected by the Apps API.
        # seed_genie creates the customer space on setup, stores the id in
        # Lakebase, and grants the app SP CAN_RUN. The app reads GENIE_SPACE_ID
        # from env when set, otherwise the stored Lakebase id.
